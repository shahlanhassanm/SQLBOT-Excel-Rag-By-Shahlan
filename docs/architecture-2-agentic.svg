<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1160" viewBox="0 0 1240 1160" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1240" height="1160" fill="#ffffff"/>

  <!-- Title -->
  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">SQLBot — PROPOSED Agentic Architecture (after update)</text>
  <text x="620" y="64" text-anchor="middle" font-size="13" fill="#64748b">5-node LangGraph agent loop · top-3 routing · multi-candidate SQL · grading + retries · cross-document synthesis</text>

  <!-- ===================== INGESTION COLUMN ===================== -->
  <text x="160" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">INGESTION (enhanced)</text>

  <rect x="30" y="122" width="260" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">1. Document / Excel upload</text>
  <text x="160" y="166" text-anchor="middle" font-size="11.5" fill="#64748b">Vue 3 frontend → FastAPI</text>

  <line x1="160" y1="180" x2="160" y2="214" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="216" width="260" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">2. Parse with pandas</text>
  <text x="160" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">header detection, multiple sheets</text>

  <line x1="160" y1="274" x2="160" y2="308" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="310" width="260" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">3. Store in PostgreSQL</text>
  <text x="160" y="354" text-anchor="middle" font-size="11.5" fill="#64748b">each sheet → SQL table</text>

  <line x1="160" y1="374" x2="160" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="410" width="260" height="92" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="160" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">4. NEW · LLM doc profile</text>
  <text x="160" y="456" text-anchor="middle" font-size="11.5" fill="#166534">summary + column descriptions</text>
  <text x="160" y="474" text-anchor="middle" font-size="11.5" fill="#166534">generated once at upload</text>

  <line x1="160" y1="502" x2="160" y2="536" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="538" width="260" height="84" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="160" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">5. NEW · Hybrid index</text>
  <text x="160" y="584" text-anchor="middle" font-size="11.5" fill="#166534">embeddings (vector) + BM25</text>
  <text x="160" y="602" text-anchor="middle" font-size="11.5" fill="#166534">(keyword) per document</text>

  <!-- index searched by finder -->
  <line x1="290" y1="578" x2="356" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- ===================== AGENT LOOP ===================== -->
  <rect x="360" y="108" width="400" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">User question</text>
  <text x="560" y="152" text-anchor="middle" font-size="11.5" fill="#64748b">POST /chat → agent graph</text>

  <line x1="560" y1="164" x2="560" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph boundary -->
  <rect x="330" y="190" width="480" height="768" rx="14" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="8,5"/>
  <text x="570" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c3aed">LangGraph agent loop — new module apps/chat/agent/</text>

  <rect x="360" y="236" width="400" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NODE 1 · FINDER</text>
  <text x="560" y="282" text-anchor="middle" font-size="11.5" fill="#475569">hybrid search: BM25 + embedding, RRF fusion</text>
  <text x="560" y="300" text-anchor="middle" font-size="11.5" fill="#475569">over doc profiles</text>
  <text x="560" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">→ TOP-3 candidate datasources (was: 1)</text>

  <line x1="560" y1="336" x2="560" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="376" width="400" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NODE 2 · DECOMPOSER</text>
  <text x="560" y="422" text-anchor="middle" font-size="11.5" fill="#475569">split question into sub-questions (multi-hop)</text>
  <text x="560" y="440" text-anchor="middle" font-size="11.5" fill="#475569">assign each sub-question → a datasource</text>
  <text x="560" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">→ enables answers spanning two documents</text>

  <line x1="560" y1="476" x2="560" y2="514" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="516" width="400" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NODE 3 · SQL GENERATOR</text>
  <text x="560" y="562" text-anchor="middle" font-size="11.5" fill="#475569">2–3 candidate SQLs per sub-question</text>
  <text x="560" y="580" text-anchor="middle" font-size="11.5" fill="#475569">(varied prompts) · self-consistency pick</text>
  <text x="560" y="598" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">→ XiYan-SQL / CHASE-SQL pattern</text>

  <line x1="560" y1="616" x2="560" y2="654" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="656" width="400" height="116" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="680" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NODE 4 · EXECUTOR + GRADER</text>
  <text x="560" y="702" text-anchor="middle" font-size="11.5" fill="#475569">run SQL → cheap LLM call judges:</text>
  <text x="560" y="720" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">"does this result answer the sub-question?"</text>
  <text x="560" y="740" text-anchor="middle" font-size="11.5" fill="#475569">pass → continue</text>
  <text x="560" y="758" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ea580c">fail → retry or fall back (orange loops)</text>

  <line x1="560" y1="772" x2="560" y2="810" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="812" width="400" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="836" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">NODE 5 · SYNTHESIZER</text>
  <text x="560" y="858" text-anchor="middle" font-size="11.5" fill="#475569">merge sub-answers across documents</text>
  <text x="560" y="876" text-anchor="middle" font-size="11.5" fill="#475569">cite source document for every fact</text>
  <text x="560" y="894" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">→ TableRAG-style intermediate answers</text>

  <line x1="560" y1="912" x2="560" y2="994" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="996" width="400" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="1029" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">Answer + chart + per-document citations → user</text>

  <!-- retry loop: N4 -> N3 -->
  <path d="M 760 700 C 800 690, 800 600, 760 586" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <rect x="770" y="626" width="78" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="809" y="641" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ea580c">retry ≤ 3</text>

  <!-- fallback loop: N4 -> N1 -->
  <path d="M 760 742 C 818 720, 818 320, 760 298" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <rect x="768" y="484" width="112" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="824" y="499" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ea580c">fallback: ds #2 / #3</text>

  <!-- ===================== WHAT THIS FIXES ===================== -->
  <text x="1045" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">WHAT THIS FIXES</text>

  <rect x="880" y="236" width="330" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1045" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">✓ Finds the right doc among 100</text>
  <text x="1045" y="282" text-anchor="middle" font-size="11" fill="#166534">keyword + meaning search over rich</text>
  <text x="1045" y="298" text-anchor="middle" font-size="11" fill="#166534">LLM profiles · top-3 instead of top-1</text>

  <rect x="880" y="360" width="330" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1045" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">✓ Answer split across TWO docs</text>
  <text x="1045" y="406" text-anchor="middle" font-size="11" fill="#166534">decomposer issues one sub-question per</text>
  <text x="1045" y="422" text-anchor="middle" font-size="11" fill="#166534">document · synthesizer merges them</text>

  <rect x="880" y="484" width="330" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1045" y="508" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">✓ Answer scattered across columns</text>
  <text x="1045" y="530" text-anchor="middle" font-size="11" fill="#166534">SQL selects both columns · wrong-column</text>
  <text x="1045" y="546" text-anchor="middle" font-size="11" fill="#166534">candidates die at execution grading</text>

  <rect x="880" y="608" width="330" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1045" y="632" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">✓ Self-healing</text>
  <text x="1045" y="654" text-anchor="middle" font-size="11" fill="#166534">grader catches empty / wrong results →</text>
  <text x="1045" y="670" text-anchor="middle" font-size="11" fill="#166534">retry with feedback, or next datasource</text>

  <rect x="880" y="732" width="330" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1045" y="756" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">⚠ Trade-off</text>
  <text x="1045" y="778" text-anchor="middle" font-size="11" fill="#92400e">2–4× LLM calls on hard questions</text>
  <text x="1045" y="794" text-anchor="middle" font-size="11" fill="#92400e">(bounded: max 3 retries per sub-question)</text>

  <!-- ===================== RUNTIME STRIP ===================== -->
  <rect x="30" y="1068" width="1180" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="620" y="1092" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">RUNTIME unchanged · one new pip dependency: langgraph (plugs into existing langchain 0.3 stack)</text>
  <text x="620" y="1116" text-anchor="middle" font-size="11.5" fill="#64748b">modify: apps/chat/task/llm.py select_datasource() → FINDER (top-3)  ·  add: apps/chat/agent/ graph with 5 nodes  ·  enrich: upload path stores LLM doc profile + hybrid index</text>
</svg>
