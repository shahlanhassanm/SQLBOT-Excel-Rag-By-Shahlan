[Service]
Environment="OLLAMA_HOST=0.0.0.0"
# Keep gpt-oss (and the embedding model) resident so every question no longer
# pays a ~15s cold reload, and so Ollama's prompt-prefix (KV) cache survives
# across turns. -1 = never unload while idle.
Environment="OLLAMA_KEEP_ALIVE=-1"
# Allow gpt-oss:20b AND mxbai-embed-large to stay loaded together instead of
# evicting each other from VRAM on every embed/chat alternation.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# Faster attention + smaller KV cache where the GPU/driver supports it.
Environment="OLLAMA_FLASH_ATTENTION=1"
